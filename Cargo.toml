[package]
name = "lazy_json"
description = "JSON lexer and parser"
version = "0.0.0"
authors = ["mnmun <mnmnmun@proton.me>"]
homepage = "https://github.com/mnmun/json"
repository = "https://github.com/mnmun/json"
readme = "README.md"
exclude = ["flake.nix", "flake.lock"]
license = "MIT"
edition = "2024"

[dependencies]
a_bc = { git = "https://github.com/mnmun/a_bc", branch = "main" }
lazy_tree = { git = "https://github.com/mnmun/lazy_tree", branch = "main" }
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
serial_test = "4.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
